<!DOCTYPE html>
<!--
  The IDW page's map (frontend/widgets/layer_map_widget.py). Layers, bottom to top:
    1. the world basemap (Esri streets or satellite tiles),
    2. the interpolated surface (an image),
    3. the boundaries (a shapefile: cities, districts, fields…),
    4. the sample points.
  Ctrl+click a boundary to select / deselect it. Python <-> JS through QWebChannel ("bridge").
  Needs an internet connection for Leaflet and the tiles (SRS constraint C-01).
-->
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    html, body, #map { height: 100%; margin: 0; background: #DDE3E1; }
    .leaflet-tooltip.name { font: 12px sans-serif; padding: 2px 6px; }
  </style>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
<div id="map"></div>
<script>
  var esri = 'https://server.arcgisonline.com/ArcGIS/rest/services/';
  var basemaps = {
    streets: L.tileLayer(esri + 'World_Street_Map/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19, attribution: 'Tiles &copy; Esri' }),
    satellite: L.tileLayer(esri + 'World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19, attribution: 'Tiles &copy; Esri' })
  };
  var map = L.map('map', { worldCopyJump: true, preferCanvas: true }).setView([30.4, 69.3], 5);
  map.attributionControl.setPrefix(false);
  L.control.scale().addTo(map);
  var basemap = basemaps.streets.addTo(map);

  // Drawing order: basemap, surface, then the boundaries and the points on ONE canvas (points
  // drawn after the boundaries, so on top). One canvas matters: a second canvas for the points
  // lay over the whole map and swallowed every click, so Ctrl+click never reached the areas.
  map.createPane('surface');  map.getPane('surface').style.zIndex = 410;
  map.createPane('vectors');  map.getPane('vectors').style.zIndex = 420;
  map.getPane('surface').style.pointerEvents = 'none';
  var vectorRenderer = L.canvas({ pane: 'vectors', padding: 0.3 });

  var surface = null, boundaries = null, points = L.layerGroup();
  var visible = { basemap: true, surface: true, boundaries: true, points: true };
  var selected = {};
  var showOthers = true;     // the boundaries of the areas not selected
  var boundaryColour = '#1F2A44', selectedColour = '#00A8E8';

  // Follow the view's size, but never re-measure a 0 x 0 (hidden) page: Leaflet can hang on it.
  function refreshMapSize() {
    var el = document.getElementById('map');
    if (el && el.clientWidth > 0 && el.clientHeight > 0) map.invalidateSize(false);
  }
  if (typeof ResizeObserver !== 'undefined') {
    new ResizeObserver(refreshMapSize).observe(document.getElementById('map'));
  }

  var bridge = null;
  new QWebChannel(qt.webChannelTransport, function (channel) {
    bridge = channel.objects.bridge;
    bridge.mapReady();
  });

  // ---- the pointer over the surface, for the value readout. At most one message a frame, and
  // "left" only once: a message on every mouse move flooded the channel and stalled the map.
  var pointerAt = null, pointerSent = false, pointerQueued = false;
  function flushPointer() {
    pointerQueued = false;
    if (!bridge) return;
    if (pointerAt) { bridge.pointerMoved(pointerAt.lng, pointerAt.lat); pointerSent = true; }
    else if (pointerSent) { bridge.pointerLeft(); pointerSent = false; }
  }
  function queuePointer(latlng) {
    pointerAt = latlng;
    if (!pointerQueued) {
      pointerQueued = true;
      if (typeof requestAnimationFrame === 'function') requestAnimationFrame(flushPointer);
      else setTimeout(flushPointer, 16);
    }
  }
  map.on('mousemove', function (e) {
    var inside = surface !== null && visible.surface && surface.getBounds().contains(e.latlng);
    queuePointer(inside ? e.latlng : null);
  });
  map.on('mouseout', function () { queuePointer(null); });

  // ---- Ctrl+click: select the area there (also when the click lands on a sample point)
  function areaHidden(index) {
    return !showOthers && !selected[index] && Object.keys(selected).length > 0;
  }

  function insideRing(ring, x, y) {
    var inside = false;
    for (var i = 0, j = ring.length - 1; i < ring.length; j = i++) {
      var xi = ring[i][0], yi = ring[i][1], xj = ring[j][0], yj = ring[j][1];
      if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) inside = !inside;
    }
    return inside;
  }

  function areaAt(latlng) {
    var found = -1;
    if (!boundaries || !map.hasLayer(boundaries)) return found;
    boundaries.eachLayer(function (layer) {
      if (found >= 0) return;
      var index = layer.feature.properties.index;
      if (areaHidden(index) || !layer.getBounds().contains(latlng)) return;
      var geometry = layer.feature.geometry;
      var polygons = geometry.type === 'MultiPolygon' ? geometry.coordinates
                   : geometry.type === 'Polygon' ? [geometry.coordinates] : [];
      polygons.forEach(function (polygon) {
        if (found >= 0 || !polygon.length) return;
        if (!insideRing(polygon[0], latlng.lng, latlng.lat)) return;
        for (var h = 1; h < polygon.length; h++) { if (insideRing(polygon[h], latlng.lng, latlng.lat)) return; }
        found = index;
      });
    });
    return found;
  }

  function isCtrl(e) { return !!(e.originalEvent && (e.originalEvent.ctrlKey || e.originalEvent.metaKey)); }

  function selectAt(latlng) {
    var index = areaAt(latlng);
    if (index >= 0 && bridge) bridge.featureToggled(index);
  }

  // A Ctrl+click on the map itself (between shapes, or over the surface) selects too.
  map.on('click', function (e) { if (isCtrl(e)) selectAt(e.latlng); });

  // Points stay drawn above the boundaries (one canvas draws in the order shapes were added).
  function pointsOnTop() {
    if (map.hasLayer(points)) points.eachLayer(function (marker) { marker.bringToFront(); });
  }

  // ---- called from Python
  function setBasemap(name) {
    if (!basemaps[name]) return;
    if (basemap && map.hasLayer(basemap)) map.removeLayer(basemap);
    basemap = basemaps[name];
    if (visible.basemap) basemap.addTo(map);
    basemap.bringToBack();
  }

  function setSurface(url, west, south, east, north, opacity) {
    if (surface) map.removeLayer(surface);
    surface = L.imageOverlay(url, [[south, west], [north, east]], { pane: 'surface', opacity: opacity });
    if (visible.surface) surface.addTo(map);
  }

  function clearSurface() { if (surface) { map.removeLayer(surface); surface = null; } }

  function setSurfaceOpacity(opacity) { if (surface) surface.setOpacity(opacity); }

  function styleFor(index) {
    var on = !!selected[index];
    if (!on && !showOthers && Object.keys(selected).length) {
      return { stroke: false, fill: false };          // only the selected area is drawn
    }
    // stroke: true is spelled out: setStyle() merges, so after hiding (stroke: false) an area
    // would otherwise stay invisible when the other areas are shown again.
    return { stroke: true, color: on ? selectedColour : boundaryColour, weight: on ? 3 : 1.2,
             fill: true, fillColor: on ? selectedColour : '#000', fillOpacity: on ? 0.12 : 0.0 };
  }

  function setBoundaries(text) {
    if (boundaries) map.removeLayer(boundaries);
    boundaries = null;
    selected = {};
    if (!text) return;
    var data = JSON.parse(text);
    boundaries = L.geoJSON(data, {
      pane: 'vectors', renderer: vectorRenderer,
      style: function (feature) { return styleFor(feature.properties.index); },
      onEachFeature: function (feature, layer) {
        if (feature.properties.name) layer.bindTooltip(feature.properties.name, { sticky: true, className: 'name' });
        layer.on('click', function (e) {
          if (!isCtrl(e)) return;                                       // Ctrl+click selects
          L.DomEvent.stop(e);
          if (!areaHidden(feature.properties.index) && bridge) bridge.featureToggled(feature.properties.index);
        });
      }
    });
    if (visible.boundaries) { boundaries.addTo(map); pointsOnTop(); }
  }

  function setSelection(indices) {
    selected = {};
    indices.forEach(function (i) { selected[i] = true; });
    if (!boundaries) return;
    boundaries.eachLayer(function (layer) { layer.setStyle(styleFor(layer.feature.properties.index)); });
  }

  function setOtherAreasVisible(on) {
    showOthers = on;
    if (!boundaries) return;
    boundaries.eachLayer(function (layer) { layer.setStyle(styleFor(layer.feature.properties.index)); });
  }

  function setPoints(list) {      // [[lon, lat, value-text], ...]
    points.clearLayers();
    list.forEach(function (p) {
      L.circleMarker([p[1], p[0]], { pane: 'vectors', renderer: vectorRenderer, radius: 4, weight: 1.2,
                                     color: '#FFFFFF', fillColor: '#111111', fillOpacity: 0.9 })
        .bindTooltip(p[2], { className: 'name' })
        .on('click', function (e) { if (isCtrl(e)) { L.DomEvent.stop(e); selectAt(e.latlng); } })
        .addTo(points);
    });
    if (visible.points && !map.hasLayer(points)) points.addTo(map);
  }

  function setVisible(name, on) {
    visible[name] = on;
    var layer = name === 'basemap' ? basemap : name === 'surface' ? surface
              : name === 'boundaries' ? boundaries : points;
    if (!layer) return;
    if (on && !map.hasLayer(layer)) {
      layer.addTo(map);
      if (name === 'basemap') layer.bringToBack();
      if (name === 'boundaries') pointsOnTop();   // re-added boundaries would cover the points
    }
    if (!on && map.hasLayer(layer)) map.removeLayer(layer);
  }

  function fitTo(west, south, east, north) {
    map.fitBounds([[south, west], [north, east]], { padding: [20, 20], maxZoom: 16 });
  }
</script>
</body>
</html>
